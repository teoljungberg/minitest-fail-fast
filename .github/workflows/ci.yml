name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "4.0"]
        minitest: ["5", "6"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install dependencies
        env:
          MINITEST_VERSION: ${{ matrix.minitest }}
        run: bundle install
      - name: Run tests
        env:
          MINITEST_VERSION: ${{ matrix.minitest }}
        run: bundle exec rake
